<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Jaberi Family Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --ink:#F3F5F9; --panel:#FFFFFF; --panel-2:#FFFFFF; --border:#D8DEEA;
  --gold:#B07D00; --gold-soft:#8A6200; --text:#1B2438; --muted:#5E6A80;
  --pos:#157F5C; --neg:#C6372C; --warn:#B26B00; --radius:10px;
}
*{box-sizing:border-box;}
html{color-scheme:light;}
body{margin:0;background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
input,select,textarea{font-family:'Inter',sans-serif;}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}

/* ---------- Shell: top bar + tab strip ---------- */
.shell{display:flex;flex-direction:column;min-height:100vh;}
.sidebar{background:var(--panel-2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
.topbar{display:flex;align-items:center;gap:18px;padding:10px 24px 0 24px;}
.brand{display:flex;align-items:baseline;gap:8px;flex:none;}
.brand .mark{font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:var(--gold-soft);letter-spacing:.5px;white-space:nowrap;}
.side-foot{flex:1;min-width:0;font-size:11px;color:var(--muted);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
.side-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--pos);}
.side-foot .dot.off{background:var(--warn);}
#userBadge{flex:none;order:3;}
.userbadge-card{margin:0 !important;padding:4px 10px !important;}
nav.tabs{display:flex;flex-direction:row;flex-wrap:wrap;align-items:stretch;gap:7px;padding:12px 24px 14px 24px;}
.nav-sec{display:none;}
.tab-btn{--c:#B07D00;flex:none;display:flex;align-items:center;gap:8px;cursor:pointer;color:#1B2438;font-size:13px;font-weight:600;letter-spacing:.2px;white-space:nowrap;padding:9px 15px;border-radius:9px;border:1px solid color-mix(in srgb,var(--c) 55%,#fff);background:color-mix(in srgb,var(--c) 14%,#fff);box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--c) 80%,transparent);transition:transform .12s,background .12s,box-shadow .12s;}
.tab-btn:hover{background:color-mix(in srgb,var(--c) 28%,#fff);transform:translateY(-1px);}
.tab-btn.active{background:var(--c);color:#fff;border-color:var(--c);box-shadow:0 4px 14px color-mix(in srgb,var(--c) 40%,transparent);transform:translateY(-1px);}
.tab-btn .badge{font-family:'IBM Plex Mono',monospace;font-size:10px;background:#1B2438;color:#fff;border-radius:9px;padding:1px 7px;}
.tab-btn.active .badge{background:#fff;color:var(--c);}
main{flex:1;min-width:0;padding:26px 32px 70px 32px;width:100%;max-width:1500px;margin:0 auto;}
@media(max-width:900px){
  .topbar{padding:8px 14px 0 14px;flex-wrap:wrap;gap:8px;}
  .side-foot{display:none;}
  #userBadge{margin-left:auto;}
  nav.tabs{padding:8px 10px 10px 10px;gap:6px;}
  .tab-btn{padding:8px 11px;font-size:12.5px;}
  .sidebar{position:static;}
  main{padding:18px 14px 60px 14px;}
}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.page-head h1{font-family:'Fraunces',serif;font-weight:600;font-size:27px;margin:0 0 4px 0;}
.page-head p{margin:0;color:var(--muted);font-size:13px;max-width:640px;line-height:1.5;}
.asof{font-size:11px;color:var(--muted);text-align:right;font-family:'IBM Plex Mono',monospace;}

/* ---------- Ledger strip ---------- */
.ledger-strip{border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto;}
.ledger-row{display:flex;min-width:max-content;width:100%;}
.ledger-cell{flex:1;padding:14px 18px;border-right:1px solid var(--border);min-width:150px;}
.ledger-cell:last-child{border-right:none;}
.ledger-cell .eyebrow{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
.ledger-cell .figure{font-family:'Fraunces',serif;font-size:23px;font-weight:600;white-space:nowrap;}
.ledger-cell .figure .ccy{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-right:5px;}
.ledger-cell .sub{margin-top:5px;font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.figure.pos,.pos{color:var(--pos);} .figure.neg,.neg{color:var(--neg);} .warn{color:var(--warn);}

/* ---------- Cards / grids ---------- */
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;} .grid-3{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:1100px){.grid-3{grid-template-columns:1fr 1fr;}}
.grid-wide{display:grid;gap:16px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);}
@media(max-width:800px){.grid-2,.grid-3,.grid-wide{grid-template-columns:1fr;}}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;min-width:0;}
.grid>.card{margin-bottom:0;}
.card h3{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin:0 0 12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.card h3 .tag,.tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);font-weight:400;}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);margin:24px 0 10px 0;border-bottom:1px solid var(--border);padding-bottom:8px;}
.helptext{font-size:12px;color:var(--muted);margin:0 0 12px 0;line-height:1.55;}
.helptext.bad{color:var(--neg);} .helptext.gold{color:var(--gold-soft);}
.tablewrap{overflow-x:auto;}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding:8px 10px;font-weight:600;white-space:nowrap;}
th.r,td.r{text-align:right;}
td{padding:8px 10px;border-bottom:1px solid rgba(216,222,234,.8);font-family:'IBM Plex Mono',monospace;font-size:12px;vertical-align:middle;}
td.name-cell{white-space:nowrap;}
td.name-cell,td.t{font-family:'Inter',sans-serif;font-size:12.5px;}
tr:last-child td{border-bottom:none;}
tr.total td{border-top:1px solid var(--border);font-weight:600;color:var(--gold-soft);}
tr.group td{background:rgba(201,162,39,.06);font-family:'Inter',sans-serif;font-weight:600;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--gold-soft);}
tr.empty-row td{text-align:center;color:var(--muted);font-family:'Inter',sans-serif;padding:20px;}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-family:'Inter',sans-serif;border:1px solid var(--border);color:var(--muted);white-space:nowrap;}
.pill.ok{color:var(--pos);border-color:var(--pos);} .pill.warn{color:var(--warn);border-color:var(--warn);} .pill.bad{color:var(--neg);border-color:var(--neg);}
.bank-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.row-actions{white-space:nowrap;text-align:right;}
.row-actions button.x{background:none;border:none;color:var(--muted);font-size:14px;padding:0 4px;}
.row-actions button.x:hover{color:var(--neg);}

/* ---------- Forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px;}
.form-grid .wide{grid-column:span 2;} .form-grid .full{grid-column:1/-1;}
label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:5px;}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:#F7F9FC;border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px;}
input[readonly]{opacity:.75;border-style:dashed;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);}
input:disabled,select:disabled,button:disabled{opacity:.5;cursor:not-allowed;}
.btn{background:var(--gold);color:#fff;border:none;padding:9px 16px;border-radius:6px;font-weight:600;font-size:12.5px;letter-spacing:.3px;}
.btn:hover:not(:disabled){background:var(--gold-soft);}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:6px;font-size:12.5px;}
.btn-ghost:hover:not(:disabled){border-color:var(--gold);color:var(--gold-soft);}
.btn-sm{padding:5px 11px;font-size:11.5px;}
.btn-danger{border-color:var(--neg);color:var(--neg);}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap;} .flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.live{background:var(--panel-2);border:1px dashed var(--border);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.7;}
.live b{color:var(--gold-soft);font-family:'IBM Plex Mono',monospace;font-weight:500;}

/* ---------- Upload ---------- */
.dropzone{border:1.5px dashed var(--border);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px;transition:.15s;cursor:pointer;}
.dropzone.drag{border-color:var(--gold);background:rgba(201,162,39,.05);color:var(--gold-soft);}
.dropzone strong{color:var(--gold-soft);}

.chart-wrap{position:relative;height:230px;}
.chart-wrap .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:20px;}
.line-item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(216,222,234,.8);font-size:12.5px;}
.line-item:last-child{border-bottom:none;}
.line-item small{display:block;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:10.5px;margin-top:2px;}
.badge-cat{font-size:9.5px;padding:2px 7px;border-radius:4px;background:rgba(139,150,171,.15);color:var(--muted);white-space:nowrap;font-family:'Inter',sans-serif;}
.badge-cat.cost{background:rgba(226,87,76,.15);color:var(--neg);}
.badge-cat.inc{background:rgba(63,182,139,.14);color:var(--pos);}
.badge-cat.learned{background:rgba(201,162,39,.18);color:var(--gold-soft);margin-left:4px;}
select.cat-select{font-size:11px;padding:4px 6px;width:auto;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--gold);color:var(--gold-soft);padding:10px 16px;border-radius:8px;font-size:12.5px;z-index:2000;box-shadow:0 6px 20px rgba(30,40,70,.18);max-width:360px;}
.toast.bad{border-color:var(--neg);color:var(--neg);}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
.step{border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12.5px;line-height:1.5;}
.step b{display:block;color:var(--gold-soft);margin-bottom:3px;}
.step.done{opacity:.55;} .step.done b::before{content:'\2713  ';color:var(--pos);}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
.seg button{background:none;border:none;color:var(--muted);padding:6px 12px;font-size:12px;}
.seg button.on{background:rgba(201,162,39,.15);color:var(--gold-soft);}

/* ---------- Users / auth ---------- */
#authOverlay:empty{display:none;}
.auth-screen{position:fixed;inset:0;background:var(--ink);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;}
.auth-box{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:30px;}
.auth-box .mark{font-family:'Fraunces',serif;font-size:24px;color:var(--gold-soft);}
.auth-box h2{font-family:'Fraunces',serif;font-size:19px;margin:14px 0 4px 0;}
.auth-box p.lead{color:var(--muted);font-size:13px;margin:0 0 18px 0;line-height:1.5;}
.user-pick{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;}
.user-pick:hover{border-color:var(--gold);}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:13px;color:#1a1408;flex:none;}
.user-pick .uname{font-size:13px;} .user-pick .urole{font-size:10.5px;color:var(--muted);}
.auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.userbadge-card{margin:0 4px 6px 4px;padding:10px;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;gap:10px;}
.userbadge-card .uname{font-size:12.5px;font-weight:600;} .userbadge-card .urole{font-size:10px;color:var(--muted);}
.userbadge-card button{margin-left:auto;background:none;border:none;color:var(--muted);font-size:10.5px;text-decoration:underline;padding:0;}
.role-pill{font-size:9.5px;padding:2px 7px;border-radius:4px;border:1px solid var(--border);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.role-pill.Admin{color:var(--gold-soft);border-color:var(--gold);} .role-pill.Editor{color:var(--pos);border-color:var(--pos);}
.activity-item{padding:8px 0;border-bottom:1px solid rgba(216,222,234,.8);font-size:12px;display:flex;gap:10px;}
.activity-item:last-child{border-bottom:none;}
.activity-item .ts{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:10.5px;white-space:nowrap;}
</style>



<div class="shell">
  <aside class="sidebar">
    <div class="topbar"><div class="brand"><span class="mark">Jaberi Family Office</span></div><div class="side-foot" id="sideFoot"></div><div id="userBadge"></div></div>
    <nav class="tabs" id="tabNav" aria-label="Main"></nav>
  </aside>
  <main id="main"></main>
</div>
<div id="authOverlay"></div>

<script>
/* ============================================================
   LEDGER — Consolidated Treasury & Accounting Console
   Ledger currency: BHD. Foreign-currency balances are tracked
   alongside their BHD book value so FX gain/loss is exact.
   ============================================================ */
const BASE = 'BHD';
const DEC = {BHD:3, KWD:3, OMR:3, JPY:0};
const PALETTE = ['#C9A227','#4E8FE2','#3FB68B','#E2574C','#B084E8','#E28F4E','#5FC9D6','#D65FA0','#8FB339','#7C8DB5','#C97B5A','#4FA3A0'];

const TABS = [
  {sec:'Overview'},
  {id:'dashboard', label:'Dashboard'},
  {sec:'Treasury'},
  {id:'accounts', label:'Banks & Accounts'},
  {id:'transactions', label:'Bank Statements'},
  {id:'deposits', label:'Fixed Deposits'},
  {id:'investments', label:'Investments'},
  {id:'debt', label:'Leverage & Debt'},
  {sec:'Accounting'},
  {id:'journal', label:'General Entries'},
  {id:'bankrecon', label:'Bank Reconciliation', badge:()=>pendingLineCount()},
  {id:'coa', label:'Chart of Accounts'},
  {id:'fstatements', label:'Financial Statements'},
  {sec:'Analysis'},
  {id:'fx', label:'FX Exposure & Gain/Loss'},
  {id:'fees', label:'Fees & Costs'},
  {id:'reports', label:'Reports'},
  {sec:'Admin'},
  {id:'settings', label:'Settings & FX'},
  {id:'users', label:'Users & Activity'},
];

/* Statement-line categories */
const COST_CATS = ['Bank Charge','Transfer Fee','FX Fee','Custody & Advisory','Brokerage','Financing'];
const INCOME_CATS = ['Interest Income','Dividend / Coupon'];
const CATS = [...COST_CATS, ...INCOME_CATS, 'Trade','Transfer','Other'];
const ASSET_CLASSES = ['Equities','Bonds','Structured Notes','Funds','Private Equity','Commodities','Derivatives','Real Estate','Deposits','Other'];
const MONETARY_SUBS = ['Cash and Cash Equivalent','Fixed Deposits','Bank Overdraft / Loan']; // revalued for FX
const MULTI_SUBS = ['Fixed Deposits','Investments','Investments in Associates'];      // may hold several currencies

let STATE = null, USERS = [], CURRENT_USER = null;
let activeTab = 'dashboard';
const UI = {};                 // transient, per-viewer UI state
const charts = {};

/* ---------------- small helpers ---------------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-3);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v==null?'':v).replace(/,/g,'')); return isFinite(n) ? n : 0; };
const r3 = x => Math.round((Number(x)||0)*1000 + (x<0?-1e-9:1e-9))/1000;
const r2 = x => Math.round((Number(x)||0)*100 + (x<0?-1e-9:1e-9))/100;
const todayISO = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const daysBetween = (a,b) => Math.round((Date.parse(b)-Date.parse(a))/864e5);
const addDays = (iso,n) => new Date(Date.parse(iso)+n*864e5).toISOString().slice(0,10);
const dec = c => DEC[c] != null ? DEC[c] : 2;
function fnum(n, ccy){ const d = dec(ccy||BASE); const v = Number(n)||0; const a = Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); return (v<0 && Math.abs(v)>=Math.pow(10,-d)/2 ? '-' : '') + a; }
const fmt = (n, ccy) => (ccy ? ccy+' ' : '') + fnum(n, ccy);
const fmtB = n => fmt(n, BASE);
const fmtDate = iso => iso || '—';
function opts(list, sel, ph){
  let h = ph!=null ? `<option value="">${esc(ph)}</option>` : '';
  list.forEach(x => { const v = typeof x==='object' ? x.v : x, l = typeof x==='object' ? x.l : x; h += `<option value="${esc(v)}"${String(v)===String(sel)?' selected':''}>${esc(l)}</option>`; });
  return h;
}
const emptyRow = (cols,msg) => `<tr class="empty-row"><td colspan="${cols}">${msg}</td></tr>`;
function stripHtml(cells){
  return `<div class="ledger-strip"><div class="ledger-row">${cells.map(c=>`<div class="ledger-cell"><div class="eyebrow">${esc(c.label)}</div><div class="figure ${c.cls||''}">${c.ccy?`<span class="ccy">${esc(c.ccy)}</span>`:''}${c.html!=null?c.html:esc(c.value)}</div>${c.sub?`<div class="sub">${c.sub}</div>`:''}</div>`).join('')}</div></div>`;
}
function toast(msg, kind){
  const t = document.createElement('div'); t.className = 'toast' + (kind==='bad'?' bad':''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), kind==='bad'?4500:2600);
}

/* ============================================================
   DEFAULT STATE (built from the supplied JFI chart of accounts)
   ============================================================ */
function defaultPosting(coa){
  const by = n => { const c = coa.find(x => x.name.trim().toLowerCase() === n); return c ? c.id : null; };
  const bc = by('bank charges'), bs = by('bank service fees'), ii = by('interest income');
  return {
    'Bank Charge':bc, 'Transfer Fee':bc, 'FX Fee':bs, 'Custody & Advisory':bs, 'Brokerage':bs, 'Financing':bc,
    'Interest Income':ii, 'Dividend / Coupon':ii, 'Trade':null, 'Transfer':null, 'Other':null,
    _fx: by('exchange rate difference'), _accrued: by('accrued interest'), _gain: by('profit/loss on sale of investments'), _fvr: by('fair value reserves'), _income: ii, _fees: bs || bc
  };
}
function defaultState(){
  const banks = SEED.banks.map(b => ({id:b.id, name:b.name, country:b.country||'', keys:b.keys}));
  const accounts = SEED.accounts.map(a => ({id:a.id, bankId:a.bank, name:a.name, type:a.type, currency:a.ccy, balance:0}));
  const coa = SEED.coa.map(c => ({id:c.id, code:c.code, name:c.name, type:c.type, category:c.category, subcategory:c.sub, statement:c.statement, currency:c.ccy, bankId:c.bank, linkedAccountId:c.link||null, openingBalance:0, openingFc:0}));
  return {
    version:2, baseCcy:BASE, company:'JFI', openingDate:'2026-09-14',

/* ============================================================
   PERSISTENCE — shared database when published, otherwise this
   browser. Data is split into shards so people editing different
   areas don't overwrite each other.
   ============================================================ */
const SHARDS = ['meta','banks','accounts','coa','journal','transactions','deposits','trades','investments','structured','valuations','debts','rules','auditLog','users'];
const CHUNK = 60000;
const Store = {mode:'memory', col:null, last:{}, nch:{}, canWrite:true, err:null};
let ME = {uid:null, name:'', isOwner:false, canWrite:true};

function getShard(k){
  if(k==='users') return USERS;
  if(k==='meta') return {version:STATE.version, baseCcy:STATE.baseCcy, company:STATE.company, openingDate:STATE.openingDate, fx:STATE.fx, fxAsOf:STATE.fxAsOf, fxConfirmed:STATE.fxConfirmed};
  return STATE[k];
}
function setShard(k, v){ if(k==='users') USERS = v; else if(k==='meta') Object.assign(STATE, v); else STATE[k] = v; }

async function storeInit(){
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      const db = await window.claude.use('db');
      if(db){ Store.mode = 'db'; Store.col = db.collection('ledger'); return; }
    }
  }catch(e){ /* fall through */ }
  try{ localStorage.setItem('__ledger_t','1'); localStorage.removeItem('__ledger_t'); Store.mode = 'local'; }
  catch(e){ Store.mode = 'memory'; }
}
function groupDocs(docs){
  const g = {}, out = {};
  docs.forEach(d => { const x = d.data(); if(x && typeof x.key === 'string') (g[x.key] = g[x.key] || []).push(x); });
  for(const k in g){
    const arr = g[k], n = arr[0].n;
    if(arr.length !== n || arr.some(p => p.n !== n)) continue;      // partial write in flight: wait
    arr.sort((a,b) => a.i-b.i); out[k] = {json: arr.map(p => p.part).join(''), n};
  }
  return out;
}
async function storeLoad(){
  const found = {};
  if(Store.mode === 'db'){
    const snap = await Store.col.get();
    const g = groupDocs(snap.docs);
    for(const k in g){ found[k] = g[k].json; Store.nch[k] = g[k].n; }
  } else if(Store.mode === 'local'){
    SHARDS.forEach(k => { try{ const v = localStorage.getItem('ledger2:'+k); if(v != null) found[k] = v; }catch(e){} });
  }
  return found;
}
async function persistShard(k){
  const json = JSON.stringify(getShard(k));
  if(json === Store.last[k]) return;
  if(Store.mode === 'db'){
    if(!Store.canWrite) return;
    const parts = []; for(let i=0; i<json.length; i+=CHUNK) parts.push(json.slice(i, i+CHUNK));
    if(!parts.length) parts.push('');
    for(let i=0; i<parts.length; i++) await Store.col.doc(k+'.'+i).set({key:k, i, n:parts.length, part:parts[i]});
    for(let j=parts.length; j<(Store.nch[k]||0); j++) await Store.col.doc(k+'.'+j).delete();
    Store.nch[k] = parts.length;
  } else if(Store.mode === 'local'){
    localStorage.setItem('ledger2:'+k, json);
  }
  Store.last[k] = json;
}
let saveChain = Promise.resolve();
function saveState(){
  saveChain = saveChain.then(async () => {
    for(const k of SHARDS){
      try{ await persistShard(k); Store.err = null; }
      catch(e){ console.error('save failed', k, e); Store.err = e; }
    }
    renderFoot();
  });
  return saveChain;
}
function applyRemote(found){
  let changed = false;
  for(const k in found){
    if(found[k] === Store.last[k]) continue;
    try{ setShard(k, JSON.parse(found[k])); Store.last[k] = found[k]; changed = true; }catch(e){ console.error('bad shard', k, e); }
  }
  return changed;
}
let rerenderTimer = null;
function scheduleRerender(){
  clearTimeout(rerenderTimer);
  rerenderTimer = setTimeout(() => {
    const a = document.activeElement;
    if(a && a.closest && a.closest('#main') && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){ UI.pendingRerender = true; return; }
    refreshIdentity(); renderMain();
  }, 350);
}
document.addEventListener('focusout', () => { if(UI.pendingRerender){ UI.pendingRerender = false; setTimeout(()=>{ const a=document.activeElement; if(!(a&&a.closest&&a.closest('#main')&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))) scheduleRerender(); }, 50); } });
function storeSubscribe(){
  if(Store.mode !== 'db') return;
  Store.col.onSnapshot(snap => {
    const g = groupDocs(snap.docs), found = {};
    for(const k in g){ found[k] = g[k].json; Store.nch[k] = g[k].n; }
    if(applyRemote(found)) scheduleRerender();
  }, err => { console.error('live sync stopped', err); Store.err = err; renderFoot(); });
}

const rate = c => (c === BASE || !c) ? 1 : (STATE.fx[c] != null ? STATE.fx[c] : 1);
const toBase = (amt, ccy) => (Number(amt)||0) * rate(ccy);

const bankName = id => { const b = bankById(id); return b ? b.name : '—'; };
const bankColor = id => { const i = STATE.banks.findIndex(b => b.id === id); return PALETTE[(i<0?0:i) % PALETTE.length]; };

const accName = id => { const a = acctById(id); return a ? a.name : 'Unknown'; };

const coaById = id => STATE.coa.find(c => c.id === id);
const coaLabel = id => { const c = coaById(id); return c ? `${c.code} ${c.name}` : '—'; };
const coaShort = id => { const c = coaById(id); return c ? c.name : '—'; };
const coaForAccount = accId => STATE.coa.find(c => c.linkedAccountId === accId);
const coaBySub = sub => STATE.coa.filter(c => c.subcategory === sub);

const isDebitNature = c => c.type === 'Asset' || c.type === 'Expense';
const userNames = () => USERS.map(u => u.name);
function bankOptions(sel, ph){ return opts(STATE.banks.map(b => ({v:b.id,l:b.name})), sel, ph); }
function coaOptions(list, sel, ph){ return opts(list.map(c => ({v:c.id, l:`${c.code}  ${c.name}`})), sel, ph); }

/* ============================================================
   ACCOUNTING ENGINE
   ============================================================ */
function lineCcy(l, a){ return l.ccy || ((a && a.currency && a.currency !== BASE) ? a.currency : BASE); }
/* Balances for one ledger account, grouped by the currency each line was booked in. */
function groups(coaId, asOf){
  const a = coaById(coaId); const g = {};
  const get = c => g[c] || (g[c] = {ccy:c, d:0, c:0, fc:0});   // d,c in BHD; fc debit-positive
  if(a && (a.openingBalance || a.openingFc)){
    const gc = get(a.currency || BASE), ob = a.openingBalance || 0, dn = isDebitNature(a);
    const sd = dn ? ob : -ob;               // signed debit
    if(sd >= 0) gc.d += sd; else gc.c += -sd;
    gc.fc += dn ? (a.openingFc || 0) : -(a.openingFc || 0);
  }
  for(const j of STATE.journal){
    if(asOf && j.date > asOf) continue;
    for(const l of j.lines){ if(l.accountId !== coaId) continue; const x = get(lineCcy(l, a)); x.d += Number(l.debit)||0; x.c += Number(l.credit)||0; x.fc += Number(l.fc)||0; }
  }
  return g;
}
/* natural balance in BHD (positive = normal side) */
function balance(coaId, asOf){
  const a = coaById(coaId); if(!a) return 0;
  const g = groups(coaId, asOf); let d = 0, c = 0;
  for(const k in g){ d += g[k].d; c += g[k].c; }
  return isDebitNature(a) ? d - c : c - d;
}
/* natural balance in the account's own currency (for FC accounts) */
function fcBalance(coaId, asOf){
  const a = coaById(coaId); if(!a) return 0;
  if(!a.currency || a.currency === BASE) return balance(coaId, asOf);
  const g = groups(coaId, asOf)[a.currency]; if(!g) return 0;
  return isDebitNature(a) ? g.fc : -g.fc;
}
const signedDebit = (c, asOf) => isDebitNature(c) ? balance(c.id, asOf) : -balance(c.id, asOf);

function mkLine(accId, side, bhd, ccy, fcAbs){
  const a = coaById(accId); if(!a) throw new Error('Ledger account missing — check Settings → posting accounts.');
  const amt = r3(bhd);
  const line = {id:uid(), accountId:accId, debit: side==='D' ? amt : 0, credit: side==='C' ? amt : 0};
  const sign = side === 'D' ? 1 : -1;
  if(a.currency && a.currency !== BASE){      // account kept in a foreign currency
    line.ccy = a.currency; line.fc = sign * r2(ccy === a.currency && fcAbs != null ? fcAbs : amt / rate(a.currency));
  } else if(ccy && ccy !== BASE && fcAbs != null && MULTI_SUBS.includes(a.subcategory)){   // deposits & investments hold several currencies
    line.ccy = ccy; line.fc = sign * r2(fcAbs);
  }
  return line;
}
const rawLine = (accId, side, bhd, ccy) => { const amt = r3(bhd); const l = {id:uid(), accountId:accId, debit:side==='D'?amt:0, credit:side==='C'?amt:0}; if(ccy){ l.ccy = ccy; l.fc = 0; } return l; };
function nextRef(){
  let m = 0; STATE.journal.forEach(j => { const n = parseInt(String(j.reference||'').replace(/\D/g,''),10); if(n > m) m = n; });
  return 'JE-' + String(m+1).padStart(4,'0');
}
/* Create (but do not save) a balanced journal entry. */
function postEntry({date, description, type, lines, link}){
  const dr = r3(lines.reduce((s,l)=>s+l.debit,0)), cr = r3(lines.reduce((s,l)=>s+l.credit,0));
  if(Math.abs(dr-cr) > 0.0015) throw new Error(`Entry does not balance (debits ${fnum(dr)} vs credits ${fnum(cr)}).`);
  const e = {id:uid(), date:date||todayISO(), reference:nextRef(), description:description||'(no description)', type:type||'manual', by:userName(), lines, link:link||null};
  STATE.journal.push(e);
  if(REG_MOVES.includes(e.type)) lines.forEach(l => { const c = coaById(l.accountId); if(c && c.linkedAccountId) regShift(c, (c.currency && c.currency !== BASE) ? (l.fc||0) : (l.debit - l.credit)); });
  return e;
}
/* The bank-account register follows real movements: entries that move money at the bank change its balance. */
const REG_MOVES = ['fd-open','fd-mature','trade','manual'];
function regShift(c, delta){ const a = acctById(c.linkedAccountId); if(a && delta) a.balance = r2((a.balance||0) + delta); }
function linesBalanced(lines){ return Math.abs(r3(lines.reduce((s,l)=>s+l.debit,0)) - r3(lines.reduce((s,l)=>s+l.credit,0))) <= 0.0015; }
function reverseEntry(id){
  const j = STATE.journal.find(x => x.id === id); if(!j) return;
  const e = postEntry({date:todayISO(), description:`Reversal of ${j.reference} — ${j.description}`, type:'reversal',
    lines:j.lines.map(l => { const n = {id:uid(), accountId:l.accountId, debit:l.credit, credit:l.debit}; if(l.ccy){ n.ccy = l.ccy; n.fc = -(l.fc||0); } return n; }), link:{reverses:j.id}});
  return e;
}
function unlinkEntry(id){
  STATE.transactions.forEach(t => { if(t.journalEntryId === id) delete t.journalEntryId; });
  STATE.deposits.forEach(d => { ['openEntryId','closeEntryId'].forEach(k => { if(d[k] === id) d[k] = null; }); });
  STATE.trades.forEach(t => { if(t.entryId === id) t.entryId = null; });
}

/* ============================================================
   CLASSIFICATION (rules + learning from corrections)
   ============================================================ */
function normDesc(s){ return String(s||'').toLowerCase().replace(/[0-9]+/g,'#').replace(/[^a-z# ]+/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,6).join(' '); }
const ruleKey = (desc, amount) => normDesc(desc) + (amount < 0 ? '|-' : '|+');
function classify(desc, amount){
  const d = ' ' + String(desc||'').toLowerCase() + ' ';
  const has = (...w) => w.some(x => d.includes(x));
  const neg = amount < 0;
  if(has('custody','advisory','safekeeping','portfolio management','management fee','mgmt fee','discretionary')) return 'Custody & Advisory';
  if(has('brokerage','commission','execution fee','trade fee','transaction fee','ticket fee','stamp duty')) return 'Brokerage';
  if(has('swift','wire fee','transfer fee','remittance','telegraphic','tt charge','outward transfer fee')) return 'Transfer Fee';
  if(has('fx fee','fx margin','forex','foreign exchange','exchange fee','conversion fee','fx conversion','currency conversion','fx spread')) return 'FX Fee';
  if(has('margin interest','loan interest','overdraft interest','debit interest','interest charge','interest on loan','lombard','finance cost','financing cost','profit paid')) return 'Financing';
  if(has('dividend',' div ')) return 'Dividend / Coupon';
  if(has('coupon')) return 'Dividend / Coupon';
  if(has('interest','profit')) return neg ? 'Financing' : 'Interest Income';
  if(has('fee','charge','maintenance','service')) return 'Bank Charge';
  if(has('buy ','sell ','purchase','sale of','subscription','redemption','settlement','trade')) return 'Trade';
  if(has('transfer','wire','remit')) return 'Transfer';
  return 'Other';
}
function classifyLine(desc, amount){
  const k = ruleKey(desc, amount);
  const l = STATE.rules.learned[k];
  if(l && CATS.includes(l)) return {category:l, learned:true};
  return {category:classify(desc, amount), learned:false};
}
const isCostCat = c => COST_CATS.includes(c);
const isCostTxn = t => isCostCat(t.category) && t.amount < 0;

/* ============================================================
   AGGREGATIONS (everything below is expressed in BHD)
   ============================================================ */
function daysLeft(iso){ return iso ? daysBetween(todayISO(), iso) : null; }
function depositAccrual(d, asOf){
  asOf = asOf || todayISO();
  const elapsed = Math.max(0, Math.min(daysBetween(d.from, asOf), d.tenor));
  const fcAcc = d.fc * (d.rate/100) * elapsed / (d.yearDays||365);
  const fcTotal = d.fc * (d.rate/100) * d.tenor / (d.yearDays||365);
  return {elapsed, fcAcc, fcTotal, bhdAcc: r3(fcAcc*rate(d.ccy)), bhdTotal: r3(fcTotal*rate(d.ccy))};
}
function positions(){
  const rows = [];
  STATE.accounts.forEach(a => {
    const bhd = toBase(a.balance, a.currency);
    if(a.balance >= 0) rows.push({kind:'Cash', bankId:a.bankId, ccy:a.currency, fc:a.balance, bhd, cls:'Cash', label:a.name});
    else rows.push({kind:'Liability', bankId:a.bankId, ccy:a.currency, fc:-a.balance, bhd:-bhd, cls:a.type==='Margin'?'Margin':'Overdraft', label:a.name});
  });
  STATE.deposits.filter(d => d.status === 'Active').forEach(d => rows.push({kind:'Deposit', bankId:d.bankId, ccy:d.ccy, fc:d.fc, bhd:toBase(d.fc,d.ccy), cls:'Fixed Deposits', label:'FD '+d.dealNo}));
  STATE.investments.forEach(i => rows.push({kind:'Investment', bankId:i.bankId, ccy:i.currency, fc:i.value, bhd:toBase(i.value,i.currency), cls:i.assetClass, label:i.name}));
  STATE.debts.forEach(d => rows.push({kind:'Liability', bankId:d.bankId, ccy:d.currency, fc:d.outstanding, bhd:toBase(d.outstanding,d.currency), cls:d.type, label:d.type}));
  return rows;
}
function totals(){
  const t = {cash:0, deposits:0, invest:0, liab:0, accrued:0};
  positions().forEach(r => { if(r.kind==='Cash') t.cash += r.bhd; else if(r.kind==='Deposit') t.deposits += r.bhd; else if(r.kind==='Investment') t.invest += r.bhd; else t.liab += r.bhd; });
  STATE.deposits.filter(d => d.status === 'Active').forEach(d => t.accrued += depositAccrual(d).bhdAcc);
  t.assets = t.cash + t.deposits + t.invest; t.net = t.assets - t.liab;
  return t;
}
function byBank(){
  const m = {}; STATE.banks.forEach(b => m[b.id] = {bank:b, cash:0, dep:0, inv:0, liab:0});
  positions().forEach(r => { const x = m[r.bankId]; if(!x) return; if(r.kind==='Cash') x.cash += r.bhd; else if(r.kind==='Deposit') x.dep += r.bhd; else if(r.kind==='Investment') x.inv += r.bhd; else x.liab += r.bhd; });
  return Object.values(m).filter(x => x.cash||x.dep||x.inv||x.liab);
}
function byCurrency(){
  const m = {};
  positions().forEach(r => { const x = m[r.ccy] || (m[r.ccy] = {ccy:r.ccy, assets:0, liab:0, assetsBhd:0, liabBhd:0}); if(r.kind==='Liability'){ x.liab += r.fc; x.liabBhd += r.bhd; } else { x.assets += r.fc; x.assetsBhd += r.bhd; } });
  return Object.values(m).sort((a,b) => (b.assetsBhd+b.liabBhd) - (a.assetsBhd+a.liabBhd));
}
function byAssetClass(){
  const m = {};
  positions().forEach(r => { if(r.kind !== 'Liability') m[r.cls] = (m[r.cls]||0) + r.bhd; });
  return m;
}
function maturities(days){
  const items = [], horizon = addDays(todayISO(), days);
  STATE.deposits.filter(d => d.status==='Active' && d.to <= horizon).forEach(d => items.push({kind:'Fixed deposit', label:`FD ${d.dealNo} — ${bankName(d.bankId)}`, date:d.to, bhd:toBase(d.fc,d.ccy)+depositAccrual(d,d.to).bhdTotal, dir:'in', ccy:d.ccy, fc:d.fc}));
  STATE.debts.filter(d => d.maturity && d.maturity <= horizon).forEach(d => items.push({kind:'Liability', label:`${d.type} — ${bankName(d.bankId)}`, date:d.maturity, bhd:toBase(d.outstanding,d.currency), dir:'out', ccy:d.currency, fc:d.outstanding}));
  STATE.structured.forEach(s => { const i = STATE.investments.find(x => x.id === s.investmentId); if(i && s.maturity && s.maturity <= horizon) items.push({kind:'Structured note', label:`${i.name} — ${bankName(i.bankId)}`, date:s.maturity, bhd:toBase(i.value,i.currency), dir:'in', ccy:i.currency, fc:i.value}); });
  return items.sort((a,b) => a.date.localeCompare(b.date));
}
/* every cost item, from statements and from trade tickets */
function costItems(){
  const out = [];
  STATE.transactions.forEach(t => { if(isCostTxn(t)) out.push({date:t.date, bankId:accBank(t.accountId), acct:accName(t.accountId), desc:t.description, cat:t.category, bhd:Math.abs(toBase(t.amount,t.currency)), src:'Statement'}); });
  STATE.trades.forEach(t => { if(t.fees > 0) out.push({date:t.tradeDate, bankId:t.bankId, acct:'Trade ticket', desc:`${t.txType} ${t.security}`, cat:'Brokerage', bhd:toBase(t.fees,t.ccy), src:'Trade'}); });
  return out.sort((a,b) => b.date.localeCompare(a.date));
}
function pendingLineCount(){ return STATE ? STATE.transactions.filter(t => !t.journalEntryId && coaForAccount(t.accountId)).length : 0; }

const RENDER = {}, AFTER = {}, ACT = {}, CHG = {}, INP = {};
const SEC_COLORS = {Overview:'#B07D00', Treasury:'#2563EB', Accounting:'#0F8F63', Analysis:'#7C3AED', Admin:'#D9531E'};
function renderNav(){
  let sec = '';
  $('#tabNav').innerHTML = TABS.map(t => { if(t.sec){ sec = t.sec; return ''; }
    return `<button class="tab-btn view-ok ${activeTab===t.id?'active':''}" style="--c:${SEC_COLORS[sec]||'#C9A227'}" title="${esc(sec)}" data-act="nav" data-tab="${t.id}" ${activeTab===t.id?'aria-current="page"':''}><span>${esc(t.label)}</span>${t.badge && t.badge() ? `<span class="badge">${t.badge()}</span>` : ''}</button>`; }).join('');
}
function destroyCharts(){ Object.keys(charts).forEach(k => { try{ charts[k].destroy(); }catch(e){} delete charts[k]; }); }
function renderMain(){
  if(!STATE || !CURRENT_USER) return;
  destroyCharts();
  const main = $('#main'), scroll = main.scrollTop;
  let html;
  try{ html = RENDER[activeTab](); }catch(e){ console.error(e); html = `<div class="card"><h3>Something went wrong showing this page</h3><p class="helptext bad">${esc(e.message)}</p></div>`; }
  main.innerHTML = html;
  try{ AFTER[activeTab] && AFTER[activeTab](); }catch(e){ console.error(e); }
  if(!canEdit()){
    $$('button, input, select, textarea', main).forEach(el => { if(!el.classList.contains('view-ok') && !el.closest('.view-ok')) el.disabled = true; });
    $$('.dropzone', main).forEach(el => { el.style.pointerEvents = 'none'; el.style.opacity = '.5'; });
    const b = document.createElement('div'); b.className = 'helptext gold'; b.textContent = 'View-only access. You can look at everything but changes are switched off.';
    if(main.firstElementChild) main.firstElementChild.after(b);
  }
  renderNav(); renderUserBadge(); renderFoot();
}
function commitNow(action, detail, msg){
  if(action) logActivity(action, detail);
  const p = saveState(); renderMain(); if(msg) toast(msg); return p;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if(!f) return;
  if(!canEdit() && !b.classList.contains('view-ok') && !['join','pickUser','createUser'].includes(b.dataset.act)){ toast('View-only access', 'bad'); return; }
  Promise.resolve().then(() => f(b, e)).catch(err => { console.error(err); toast(err.message || 'Something went wrong', 'bad'); });
});

};

function drawDoughnut(id, data){
  const el = $('#'+id); if(!el) return;
  data = data.filter(d => d.value > 0.0005);
  if(!data.length || typeof Chart === 'undefined'){ el.style.display = 'none'; el.parentElement.insertAdjacentHTML('beforeend', '<div class="none">Nothing to chart yet. Balances appear here once you add them.</div>'); return; }
  charts[id] = new Chart(el, {type:'doughnut',
    data:{labels:data.map(d=>d.label), datasets:[{data:data.map(d=>d.value), backgroundColor:data.map((d,i)=>d.color||PALETTE[i%PALETTE.length]), borderColor:'#FFFFFF', borderWidth:2}]},
    options:{maintainAspectRatio:false, cutout:'62%', plugins:{legend:{position:'bottom', labels:{color:'#5E6A80', font:{size:10.5}, boxWidth:10, padding:9}}, tooltip:{callbacks:{label:c=>` ${c.label}: ${fnum(c.parsed)} ${BASE}`}}}}});
}
function drawBars(id, labels, values, color){
  const el = $('#'+id); if(!el) return;
  if(!values.some(v => v > 0.0005) || typeof Chart === 'undefined'){ el.style.display = 'none'; el.parentElement.insertAdjacentHTML('beforeend', '<div class="none">No data in this period.</div>'); return; }
  charts[id] = new Chart(el, {type:'bar', data:{labels, datasets:[{data:values, backgroundColor:color||'#C9A227', borderRadius:4}]},
    options:{maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{ticks:{color:'#5E6A80', font:{size:10.5}}, grid:{color:'#E1E6F0'}}, y:{ticks:{color:'#5E6A80', font:{size:10.5}}, grid:{color:'#E1E6F0'}}}}});
}

}

const ACCT_TYPES = [{v:'Current',l:'Current'},{v:'Deposit',l:'Call / savings deposit'},{v:'Brokerage',l:'Brokerage (cash held with broker)'},{v:'Margin',l:'Margin'}];
function nextCode(subName){
  const s = allSubs().find(x => x.name === subName); if(!s) return '';
  let max = s.base - 1;
  STATE.coa.filter(c => c.subcategory === subName).forEach(c => { const n = parseInt(c.code.split('-').pop(),10); if(n > max) max = n; });
  return `${s.prefix}-000-${String(max+1).padStart(4,'0')}`;
}
function allSubs(){
  const list = SEED.subs.map(s => ({...s}));
  STATE.coa.forEach(c => { if(!list.some(s => s.name === c.subcategory)) list.push({category:c.category, type:c.type, prefix:c.code.split('-').slice(0,3).join('-'), base:100, name:c.subcategory, statement:c.statement}); });
  return list;
}
function bankInUse(id){
  return STATE.accounts.some(a=>a.bankId===id) || STATE.deposits.some(a=>a.bankId===id) || STATE.investments.some(a=>a.bankId===id) || STATE.debts.some(a=>a.bankId===id) || STATE.trades.some(a=>a.bankId===id);
}

ACT.delBank = async b => {
  const bk = bankById(b.dataset.id); if(bankInUse(bk.id)) throw new Error(`${bk.name} still has accounts, deposits, investments or facilities. Remove those first.`);
  STATE.banks = STATE.banks.filter(x => x.id !== bk.id); STATE.coa.forEach(c => { if(c.bankId === bk.id) c.bankId = null; });
  await commitNow('Removed bank', bk.name, 'Bank removed');

ACT.addAcct = async () => {
  const bankId = $('#acBank').value, name = $('#acName').value.trim(), ccy = $('#acCcy').value;

  let link = $('#acLink').value, c;
  if(link){ c = coaById(link); c.linkedAccountId = acc.id; if(!c.bankId) c.bankId = bankId; }
  else {
    const sub = allSubs().find(s => s.name === 'Cash and Cash Equivalent');
    c = {id:'c'+uid(), code:nextCode(sub.name), name, type:'Asset', category:'Assets', subcategory:sub.name, statement:'Balance Sheet', currency:ccy, bankId, linkedAccountId:acc.id, openingBalance:0, openingFc:0};

function parseAmt(v){
  if(typeof v === 'number') return v;
  let s = String(v==null?'':v).trim(); if(!s) return 0;
  const neg = /^\(.*\)$/.test(s) || /-\s*$/.test(s) || /\bDR\b/i.test(s);
  s = s.replace(/[^0-9.,\-]/g,'');
  if(/,\d{1,2}$/.test(s) && !/\.\d/.test(s)) s = s.replace(/\./g,'').replace(',','.');   // 1.234,50
  s = s.replace(/,/g,'');
  const n = parseFloat(s); if(!isFinite(n)) return 0;
  return neg && n > 0 ? -n : n;
}
function normalizeDate(v){
  if(v instanceof Date) return new Date(v.getTime() - v.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const s = String(v==null?'':v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ let y = m[3].length === 2 ? '20'+m[3] : m[3]; let d = +m[1], mo = +m[2]; if(mo > 12 && d <= 12){ const t = d; d = mo; mo = t; } return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
  const t = Date.parse(s + ' UTC'); if(!isNaN(t)) return new Date(t).toISOString().slice(0,10);
  const t2 = Date.parse(s); if(!isNaN(t2)) return new Date(t2 - new Date(t2).getTimezoneOffset()*60000).toISOString().slice(0,10);
  return '';
}
function rowToTxn(row){
  const keys = Object.keys(row), low = keys.map(k => k.toLowerCase().trim());
  const find = (pats, not) => { const i = low.findIndex(k => pats.some(p => k.includes(p)) && !(not||[]).some(n => k.includes(n))); return i < 0 ? null : keys[i]; };
  const dK = find(['transaction date','trans date','booking date','posting date','txn date','date'], ['value date','maturity']) || find(['date']);
  const descK = find(['description','narrative','details','particular','memo','remark','reference','transaction']);
  const amtK = find(['amount','amt'], ['balance']);
  const debK = find(['debit','withdrawal','paid out','dr']), crK = find(['credit','deposit','paid in','cr'], ['credit card']);
  let amount = 0;
  if(amtK && String(row[amtK]).trim() !== '') amount = parseAmt(row[amtK]);
  else if(debK || crK){ amount = Math.abs(parseAmt(crK ? row[crK] : 0)) - Math.abs(parseAmt(debK ? row[debK] : 0)); }
  const description = String(descK ? row[descK] : Object.values(row).filter(v => typeof v === 'string').join(' ')).trim().slice(0,160) || '(no description)';
  const date = normalizeDate(dK ? row[dK] : '') || todayISO();
  return {date, description, amount};
}
async function parseCSVFile(file){ return new Promise((res, rej) => Papa.parse(file, {header:true, skipEmptyLines:true, complete:r => res(r.data.map(rowToTxn)), error:rej})); }
async function parseXLSXFile(file){
  const wb = XLSX.read(await file.arrayBuffer(), {type:'array', cellDates:true});
  let best = [];
  wb.SheetNames.forEach(n => { const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], {defval:'', raw:false, dateNF:'yyyy-mm-dd'}).map(rowToTxn).filter(r => r.amount !== 0); if(rows.length > best.length) best = rows; });
  return best;
}
async function parsePDFFile(file){
  if(typeof pdfjsLib === 'undefined') throw new Error('The PDF reader did not load. Check your connection, or upload the statement as Excel or CSV.');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  const lines = [];
  for(let p = 1; p <= pdf.numPages; p++){
    const content = await (await pdf.getPage(p)).getTextContent();
    const items = content.items.filter(i => i.str && i.str.trim()).map(i => ({s:i.str, x:i.transform[4], y:Math.round(i.transform[5])}));
    const byY = {}; items.forEach(i => { const k = Object.keys(byY).find(y => Math.abs(y - i.y) <= 3); (byY[k != null ? k : i.y] = byY[k != null ? k : i.y] || []).push(i); });
    Object.keys(byY).map(Number).sort((a,b) => b-a).forEach(y => lines.push(byY[y].sort((a,b) => a.x-b.x).map(i => i.s).join(' ')));
  }
  const dateRe = /(\d{4}-\d{2}-\d{2}|\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}|\d{1,2}\s(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s\d{2,4})/i;
  const amtRe = /\(?-?\d{1,3}(?:,\d{3})*\.\d{2,3}\)?(?:\s?(?:DR|CR))?/gi;
  const rows = [];
  lines.forEach(line => {
    const dm = line.match(dateRe); if(!dm) return;
    const rest = line.replace(dm[0], ' ');
    const amts = rest.match(amtRe); if(!amts || !amts.length) return;
    const pick = amts.length >= 2 ? amts[amts.length-2] : amts[0];       // last figure is usually the running balance
    let amount = parseAmt(pick);
    const lc = rest.toLowerCase();
    if(/\bcr\b/i.test(pick)) amount = Math.abs(amount); else if(/\bdr\b/i.test(pick)) amount = -Math.abs(amount);
    else if(amount > 0 && /(debit|withdraw|charge|fee|paid|payment|purchase|commission)/.test(lc)) amount = -amount;
    let description = amts.reduce((s,a) => s.replace(a,' '), rest).replace(/\s+/g,' ').trim().slice(0,160);
    rows.push({date:normalizeDate(dm[0]) || todayISO(), description:description || '(statement line)', amount});
  });
  return rows;
}

  rows.forEach(r => { const c = classifyLine(r.description, r.amount); r.category = c.category; r.auto = c.category; r.learned = c.learned; });

function postAccrual(deps, asOf){
  const acc = needAcct('_accrued','accrued interest'), inc = needAcct('_income','interest income');
  let net = 0; const touched = [];
  deps.forEach(d => { const delta = r3(depositAccrual(d, asOf).bhdAcc - (d.accruedBooked||0)); if(Math.abs(delta) >= 0.001){ net = r3(net + delta); touched.push([d, delta]); } });
  if(!touched.length) return null;
  const lines = net >= 0 ? [rawLine(acc,'D',net), rawLine(inc,'C',net)] : [rawLine(acc,'C',-net), rawLine(inc,'D',-net)];
  const e = postEntry({date:asOf, description:`Deposit interest accrued to ${asOf}${deps.length>1?` (${touched.length} deposits)`:` — ${deps[0].dealNo}`}`, type:'accrual', lines});
  touched.forEach(([d, delta]) => { d.accruedBooked = r3((d.accruedBooked||0) + delta); });
  return e;
}

    const inc = needAcct('_income','interest income'), acc = needAcct('_accrued','accrued interest'), fx = needAcct('_fx','exchange rate difference');
    const r = rate(d.ccy), recv = r3((d.fc + intFc) * r), booked = d.accruedBooked || 0, intB = r3(intFc * r), fxd = r3(d.fc * r - d.bd);

function readTrade(){
  const g = id => $('#'+id), q = id => g(id).value;
  return {bankId:q('tr_bank'), assetClass:q('tr_class'), security:q('tr_name').trim(), ref:q('tr_ref').trim(), txType:q('tr_tx'), tradeDate:q('tr_date'), settleDate:q('tr_settle'),
    broker:q('tr_broker').trim(), custody:q('tr_custody').trim(), qty:num(q('tr_qty')), price:num(q('tr_price')), basis:q('tr_basis'), ccy:q('tr_ccy'), fx:num(q('tr_fx')),
    gross:num(q('tr_gross')), fees:num(q('tr_fees')), accrued:num(q('tr_acc')), notes:q('tr_notes').trim(), reviewedBy:q('tr_rev'), formDate:q('tr_formdate'),
    coaId:q('tr_coa'), cashCoaId:q('tr_cash'), post:g('tr_post').checked};
}
function tradeCalc(t){
  const buy = isBuyTx(t.txType), h = findHolding(t.bankId, t.security, t.ccy);
  const gB = r3(t.gross*t.fx), fB = r3(t.fees*t.fx), aB = r3(t.accrued*t.fx);
  const c = {buy, h, gB, fB, aB, net: buy ? t.gross+t.fees+t.accrued : t.gross-t.fees+t.accrued, frac:0, costRelB:0, costRelFc:0, gain:0};
  if(!buy){
    if(!h) throw new Error(`No holding called "${t.security}" in ${t.ccy} at ${bankName(t.bankId)}. Check the name, bank and currency.`);
    c.frac = h.qty > 0 ? Math.min(1, t.qty / h.qty) : 1;
    c.costRelB = r3((h.costBhd||0) * c.frac); c.costRelFc = r2(h.cost * c.frac); c.gain = r3(gB - c.costRelB);
  }
  return c;
}
function tradeLines(t, c){
  const P = STATE.rules.posting, L = [];
  if(!t.coaId) throw new Error('Choose the investment account.'); if(!t.cashCoaId) throw new Error('Choose the cash account the trade settles through.');
  if(c.buy){
    L.push(mkLine(t.coaId,'D',c.gB,t.ccy,t.gross));
    if(c.fB > 0) L.push(mkLine(needAcct('_fees','fees'),'D',c.fB));
    if(c.aB > 0) L.push(mkLine(needAcct('_accrued','accrued interest'),'D',c.aB));
    L.push(mkLine(t.cashCoaId,'C',r3(c.gB+c.fB+c.aB),t.ccy,c.net));
  } else {
    L.push(mkLine(t.cashCoaId,'D',r3(c.gB-c.fB+c.aB),t.ccy,c.net));
    if(c.fB > 0) L.push(mkLine(needAcct('_fees','fees'),'D',c.fB));
    L.push(mkLine(c.h.coaId || t.coaId,'C',c.costRelB,t.ccy,c.costRelFc));
    if(c.aB > 0) L.push(mkLine(needAcct('_accrued','accrued interest'),'C',c.aB));
    if(c.gain > 0) L.push(mkLine(needAcct('_gain','profit or loss on sale'),'C',c.gain)); else if(c.gain < 0) L.push(mkLine(needAcct('_gain','profit or loss on sale'),'D',-c.gain));
  }
  return L;
}
function trRefresh(fromGross){
  const g = id => $('#'+id); if(!g('tr_qty')) return;
  const fxEl = g('tr_fx'), gEl = g('tr_gross');
  if(!fromGross && gEl.dataset.t !== '1'){ const q = num(g('tr_qty').value), p = num(g('tr_price').value); gEl.value = (q && p) ? r2(g('tr_basis').value === 'pct' ? q*p/100 : q*p) : ''; }
  const t = readTrade(); if(!t.fx) t.fx = rate(t.ccy);
  const buy = isBuyTx(t.txType), net = buy ? t.gross+t.fees+t.accrued : t.gross-t.fees+t.accrued;
  g('tr_net').value = t.gross ? fnum(net, t.ccy) : ''; g('tr_bhd').value = t.gross ? fnum(net*t.fx) : '';
  const live = g('tr_live');
  if(!t.gross){ live.textContent = 'Enter the trade to preview the ledger entry.'; return; }
  if(!t.post){ live.innerHTML = 'Ledger posting is switched off. Only the holding and trade record will be updated.'; return; }
  if(!t.coaId || !t.cashCoaId){ live.textContent = 'Choose the investment and cash accounts to preview the ledger entry.'; return; }
  try{
    const lines = tradeLines(t, tradeCalc(t));
    live.innerHTML = 'Ledger entry: ' + lines.map(l => `${l.debit?'Dr':'Cr'} <b>${esc(coaShort(l.accountId))}</b> ${fnum(l.debit||l.credit)}`).join(' &nbsp;·&nbsp; ');
  }catch(e){ live.innerHTML = `<span class="neg">${esc(e.message)}</span>`; }
}

ACT.trSave = async () => {
  const t = readTrade(); if(!t.fx) t.fx = rate(t.ccy);
  if(!t.bankId) throw new Error('Choose the portfolio or bank.'); if(!t.security) throw new Error('Enter the security name.');
  if(!t.tradeDate) throw new Error('Enter the trade date.'); if(!(t.qty > 0)) throw new Error('Enter the quantity or face value.');
  if(!(t.gross > 0)) throw new Error('Enter the price, or the gross amount.'); if(!(t.fx > 0)) throw new Error('Enter the FX rate to ' + BASE + '.');
  const c = tradeCalc(t);
  if(!c.buy && t.qty > c.h.qty + 1e-9) throw new Error(`You hold ${fnum(c.h.qty,'X')} of "${c.h.name}" and the trade sells ${fnum(t.qty,'X')}.`);
  let entry = null;
  if(t.post){
    entry = postEntry({date:t.settleDate || t.tradeDate, description:`${t.txType} ${t.security} — ${bankName(t.bankId)}`, type:'trade', lines:tradeLines(t, c), link:{}});
  }
  let h = c.h;
  if(c.buy){
    if(!h){ h = {id:uid(), bankId:t.bankId, coaId:t.coaId||null, name:t.security, ref:t.ref, assetClass:t.assetClass, currency:t.ccy, qty:0, cost:0, costBhd:0, value:0, income:0, valuationDate:t.tradeDate, valuationSource:'trade'}; STATE.investments.push(h); }
    h.qty += t.qty; h.cost = r2(h.cost + t.gross); h.costBhd = r3((h.costBhd||0) + c.gB); h.value = r2(h.value + t.gross);
    h.valuationDate = t.tradeDate; if(t.ref) h.ref = t.ref; if(t.coaId) h.coaId = t.coaId;
  } else {
    h.qty = h.qty - t.qty; h.cost = r2(h.cost - c.costRelFc); h.costBhd = r3((h.costBhd||0) - c.costRelB); h.value = r2(h.value * (1 - c.frac));
    if(c.frac >= 1 || h.qty <= 1e-9){ STATE.investments = STATE.investments.filter(x => x.id !== h.id); STATE.structured = STATE.structured.filter(s => s.investmentId !== h.id); }
  }
  const tr = {id:uid(), bankId:t.bankId, assetClass:t.assetClass, security:t.security, ref:t.ref, txType:t.txType, tradeDate:t.tradeDate, settleDate:t.settleDate, broker:t.broker, custody:t.custody,
    qty:t.qty, price:t.price, basis:t.basis, ccy:t.ccy, fx:t.fx, gross:t.gross, fees:t.fees, accrued:t.accrued, net:r2(c.net), bhdEq:r3(c.net*t.fx), notes:t.notes,
    preparedBy:userName(), reviewedBy:t.reviewedBy, formDate:t.formDate, coaId:t.coaId, cashCoaId:t.cashCoaId, entryId:entry?entry.id:null, holdingId:h.id, realisedBhd:c.buy?0:c.gain};
  STATE.trades.push(tr);
  await commitNow(`Recorded ${t.txType.toLowerCase()}`, `${t.security}, ${fnum(t.gross,t.ccy)} ${t.ccy}`, entry ? `Trade saved and posted (${entry.reference})` : 'Trade saved');
};

function mtmRows(){

function postMtm(rows){

}

function contraFor(t){ return STATE.rules.contra[ruleKey(t.description, t.amount)] || STATE.rules.posting[t.category] || null; }
function postTxn(t, contraId){
  const cash = coaForAccount(t.accountId); if(!cash) throw new Error('This bank account is not linked to a ledger account.');
  const amt = Math.abs(t.amount), bhd = r3(amt * rate(t.currency)), debit = t.amount >= 0;
  const lines = debit ? [mkLine(cash.id,'D',bhd,t.currency,amt), mkLine(contraId,'C',bhd)] : [mkLine(contraId,'D',bhd), mkLine(cash.id,'C',bhd,t.currency,amt)];
  const e = postEntry({date:t.date, description:t.description, type:'bank', lines, link:{txnId:t.id}});
  t.journalEntryId = e.id; return e;
}
function autoPostTxns(list){
  let posted = 0, skipped = 0;
  list.forEach(t => {
    if(t.journalEntryId) return;
    const cash = coaForAccount(t.accountId), c = contraFor(t);
    if(!cash || !c || !coaById(c) || c === cash.id){ skipped++; return; }
    postTxn(t, c); posted++;
  });
  return {posted, skipped};
}

function fsData(asOf){
  const rows = STATE.coa.map(c => ({c, sd: signedDebit(c, asOf)}));
  const pl = rows.filter(r => r.c.statement === 'Income Statement');
  const bs = rows.filter(r => r.c.statement !== 'Income Statement');
  const income = pl.filter(r => !isDebitNature(r.c)), expense = pl.filter(r => isDebitNature(r.c));
  const incTot = income.reduce((s,r) => s - r.sd, 0), expTot = expense.reduce((s,r) => s + r.sd, 0);
  const profit = incTot - expTot;
  const assets = bs.filter(r => r.c.type === 'Asset'), liabs = bs.filter(r => r.c.type === 'Liability'), equity = bs.filter(r => r.c.type === 'Equity');
  const aT = assets.reduce((s,r) => s + r.sd, 0), lT = liabs.reduce((s,r) => s - r.sd, 0), eT = equity.reduce((s,r) => s - r.sd, 0);

}

}

/* One row per (monetary ledger account, foreign currency) with the book value in BHD and the value at today's rates. */
function fxLedgerRows(){
  const out = [];
  STATE.coa.filter(c => MONETARY_SUBS.includes(c.subcategory)).forEach(c => {
    const g = groups(c.id);
    Object.values(g).forEach(x => {
      if(!x.ccy || x.ccy === BASE) return;
      const book = r3(x.d - x.c);                       // signed debit, BHD
      if(Math.abs(x.fc) < 0.005 && Math.abs(book) < 0.0005) return;
      const target = r3(x.fc * rate(x.ccy));
      out.push({coa:c, ccy:x.ccy, fc:x.fc, book, target, diff:r3(target - book)});   // diff > 0 : gain
    });
  });
  return out;
}
function fxHistory(){
  const id = STATE.rules.posting._fx; const rows = [];
  STATE.journal.forEach(j => { let g = 0; j.lines.forEach(l => { if(l.accountId === id) g += (Number(l.credit)||0) - (Number(l.debit)||0); });
    if(Math.abs(g) > 0.0005) rows.push({date:j.date, ref:j.reference, desc:j.description, type:j.type, gain:r3(g), unreal:j.type === 'fx-reval'}); });
  const a = coaById(id); if(a && (a.openingBalance)) { /* opening balance on the FX account is not a gain of this period */ }
  return rows.sort((x,y) => y.date.localeCompare(x.date));
}

      ${exp.map(x => `<tr><td class="t">${esc(x.ccy)}</td><td class="r">${fnum(x.fc, x.ccy)}</td><td class="r mono">${rate(x.ccy)}</td><td class="r">${fnum(x.target)}</td><td class="r ${x.target>=0?'pos':'neg'}">${fnum(x.target*.05)}</td><td class="r ${x.target>=0?'neg':'pos'}">${fnum(-x.target*.05)}</td></tr>`).join('') || emptyRow(6,'No foreign-currency balances in the ledger yet.')}
      </tbody></table></div>
      <p class="helptext" style="margin-top:10px">Net amount is cash and deposits less loans, in that currency, taken from the ledger. The BHD is pegged to the US dollar, so the USD line carries little real risk. CHF, EUR, GBP and TRY are where moves matter. Moves show the effect on the group if the rate against ${BASE} rises or falls.</p></div>

ACT.fxPost = async () => {
  if(!STATE.fxConfirmed) throw new Error('Confirm the FX rates in Settings & FX first.');
  const fxId = STATE.rules.posting._fx; if(!coaById(fxId)) throw new Error('Choose the Exchange Rate Difference account in Settings → posting accounts.');
  const rows = fxLedgerRows().filter(r => Math.abs(r.diff) > 0.0005); if(!rows.length) throw new Error('The ledger is already at today\'s rates.');

function perfData(){
  const T = invTotals(), tot = totals();
  const stmtIncome = STATE.transactions.filter(t => INCOME_CATS.includes(t.category) && t.amount > 0).reduce((s,t) => s + toBase(t.amount, t.currency), 0);
  const costs = costItems().reduce((s,i) => s + i.bhd, 0);
  const fxHist = (typeof fxHistory === 'function') ? fxHistory().reduce((s,h) => s + h.gain, 0) : 0;
  const income = T.income + stmtIncome + tot.accrued;
  return {T, tot, income, stmtIncome, costs, fxHist, net: T.unreal + T.realised + income - costs};
}
function bankPerf(){
  const m = {}; STATE.banks.forEach(b => m[b.id] = {bank:b, assets:0, cost:0, unreal:0, income:0, fees:0});
  byBank().forEach(r => { if(m[r.bank.id]) m[r.bank.id].assets = r.cash + r.dep + r.inv; });
  STATE.investments.forEach(h => { const x = m[h.bankId]; if(!x) return; x.unreal += toBase(h.value,h.currency) - (h.costBhd != null ? h.costBhd : toBase(h.cost,h.currency)); x.income += toBase(h.income,h.currency); });
  STATE.deposits.filter(d => d.status === 'Active').forEach(d => { const x = m[d.bankId]; if(x) x.income += depositAccrual(d).bhdAcc; });
  costItems().forEach(i => { const x = m[i.bankId]; if(x) x.fees += i.bhd; });
  return Object.values(m).filter(x => x.assets || x.fees || x.unreal || x.income);
}
/* does the ledger agree with the registers? */
function tieOut(){
  const sum = sub => STATE.coa.filter(c => c.subcategory === sub).reduce((s,c) => s + balance(c.id), 0);
  const cashReg = STATE.accounts.reduce((s,a) => s + toBase(a.balance, a.currency), 0);
  const fdReg = STATE.deposits.filter(d => d.status === "Active" && d.coaId).reduce((s,d) => s + toBase(d.fc, d.ccy), 0);
  const invReg = STATE.investments.reduce((s,h) => s + (h.costBhd != null ? h.costBhd : toBase(h.cost, h.currency)), 0);
  const loanReg = STATE.debts.reduce((s,d) => s + toBase(d.outstanding, d.currency), 0);
  return [
    {label:'Cash at banks', ledger:sum('Cash and Cash Equivalent'), reg:cashReg, tip:'Bank balances in Banks & Accounts'},
    {label:'Fixed deposits (principal)', ledger:sum('Fixed Deposits'), reg:fdReg, tip:'Active deposits with a ledger account, at current rates'},
    {label:'Investments (at cost)', ledger:sum('Investments') + sum('Investments in Associates'), reg:invReg, tip:'Holdings at cost in BHD'},
    {label:'Loans', ledger:sum('Bank Overdraft / Loan'), reg:loanReg, tip:'Facilities in Leverage & Debt'}
  ].map(r => ({...r, diff:r3(r.ledger - r.reg)}));
}

CHG.openDate = async el => { if(el.value){ STATE.openingDate = el.value; await commitNow('Changed opening date', el.value); } };
CHG.fxRate = async el => {
  const c = el.dataset.c, v = num(el.value); if(!(v > 0)){ toast('Enter a rate above zero', 'bad'); renderMain(); return; }
  if(STATE.fx[c] !== v){ logActivity('Changed FX rate', `${c} ${STATE.fx[c]} → ${v}`); STATE.fx[c] = v; STATE.fxConfirmed = false; await saveState(); renderMain(); toast('Rate saved. Press Confirm when all rates are right.'); }
};
ACT.fxConfirm = async () => { STATE.fxConfirmed = true; STATE.fxAsOf = $('#fx_asof').value || todayISO(); await commitNow('Confirmed FX rates', `as of ${STATE.fxAsOf}`, 'Rates confirmed'); };
ACT.fxAdd = async () => {
  const c = ($('#fx_new').value || '').trim().toUpperCase(), r = num($('#fx_newr').value);
  if(!/^[A-Z]{3}$/.test(c)) throw new Error('Use a 3-letter currency code.'); if(STATE.fx[c] != null) throw new Error(c + ' is already in the list.'); if(!(r > 0)) throw new Error('Enter the rate.');
  STATE.fx[c] = r; STATE.fxConfirmed = false; await commitNow('Added currency', `${c} @ ${r}`, c + ' added');
};
ACT.fxDel = async b => {
  const c = b.dataset.c; if(ccyInUse(c)) throw new Error(c + ' is used by accounts or entries, so it can\'t be removed.');
  delete STATE.fx[c]; await commitNow('Removed currency', c, c + ' removed');
};
CHG.postAcct = async el => { STATE.rules.posting[el.dataset.k] = el.value || null; await commitNow('Changed posting account', `${el.dataset.k} → ${coaLabel(el.value)}`, 'Saved'); };
ACT.ruleDel = async b => { delete STATE.rules.learned[b.dataset.k]; await commitNow('Forgot learned rule', b.dataset.k); };

function stateForBackup(){ const o = {}; SHARDS.forEach(k => { o[k] = getShard(k); }); return o; }
ACT.backupExport = async () => { await saveFile(`JFI-ledger-backup-${todayISO()}.json`, JSON.stringify({app:'jfi-ledger', exported:new Date().toISOString(), data:stateForBackup()}), 'application/json'); };
CHG.backupImport = async el => {
  const f = el.files && el.files[0]; if(!f) return;
  try{
    const o = JSON.parse(await f.text()), d = o && o.data; if(!d || !Array.isArray(d.coa) || !Array.isArray(d.journal)) throw new Error('This does not look like a backup from this system.');
    SHARDS.forEach(k => { if(k !== 'users' && d[k] != null) setShard(k, d[k]); });
    if(Array.isArray(d.users) && !USERS.length) USERS = d.users;
    await commitNow('Restored backup', f.name, 'Backup restored');
  }catch(e){ toast(e.message || 'Could not read that file', 'bad'); }
  el.value = '';
};
ACT.resetAll = async () => {
  if(!isAdmin()) throw new Error('Only an Admin can reset.');
  if(UI.set.armed !== 'reset'){ UI.set.armed = 'reset'; renderMain(); setTimeout(() => { if(UI.set.armed === 'reset'){ UI.set.armed = ''; if(activeTab === 'settings') renderMain(); } }, 6000); return; }
  UI.set.armed = ''; const keep = STATE.auditLog; const fresh = defaultState(); Object.keys(fresh).forEach(k => { STATE[k] = fresh[k]; }); STATE.auditLog = keep;
  await commitNow('Reset to template', 'All entries and balances removed', 'Reset complete');
};

/* ============================================================
   USERS & ACTIVITY
   ============================================================ */
RENDER.users = () => {
  const admin = isAdmin(), db = Store.mode === 'db', log = STATE.auditLog.slice(0, 120);
  const roleNote = {Admin:'Everything, including users, reset and deleting entries', Editor:'Enter and change data', Viewer:'Look only'};
  return `
  <div class="page-head"><div><h1>Users &amp; activity</h1><p>Who can do what, and a record of what each person did.</p></div></div>
  <div class="card"><h3>Team</h3><div class="tablewrap"><table><thead><tr><th>Name</th><th>Role</th><th></th></tr></thead><tbody>
    ${USERS.map(u => `<tr><td><span class="avatar" style="background:${u.color};display:inline-flex;width:24px;height:24px;font-size:10px;margin-right:8px;vertical-align:middle">${esc(initials(u.name))}</span>${esc(u.name)}${CURRENT_USER && u.id === CURRENT_USER.id ? ' <span class="tag">you</span>' : ''}</td>
      <td>${admin ? `<select data-chg="userRole" data-id="${esc(u.id)}" style="width:120px" aria-label="Role">${opts(['Admin','Editor','Viewer'], u.role)}</select>` : `<span class="role-pill">${esc(u.role)}</span>`} <span class="helptext">${esc(roleNote[u.role]||'')}</span></td>
      <td class="row-actions">${admin && !db && CURRENT_USER && u.id !== CURRENT_USER.id ? `<button class="x" data-act="userDel" data-id="${esc(u.id)}" aria-label="Remove user">✕</button>` : ''}</td></tr>`).join('') || emptyRow(3,'No users yet.')}</tbody></table></div>
    ${admin && !db ? `<div class="form-grid" style="margin-top:12px"><div><label for="nu_name">Add a team member</label><input id="nu_name" placeholder="Full name"></div><div><label for="nu_role">Role</label><select id="nu_role">${opts(['Editor','Viewer','Admin'],'Editor')}</select></div><div style="display:flex;align-items:flex-end"><button class="btn" data-act="userAdd">Add</button></div></div>` : ''}
    <p class="helptext" style="margin-top:10px">${db ? 'Share this page from Claude to give accountants access. Contributor access lets a person enter data, Viewer access is read-only. Each person appears here the first time they open it, and an Admin sets their role.' : 'In this browser you add people yourself. Publishing the page and sharing it gives each person their own sign-in.'}</p></div>
  <div class="card"><h3>Activity log</h3><div class="tablewrap" style="max-height:480px;overflow:auto"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Detail</th></tr></thead><tbody>
    ${log.map(a => `<tr><td class="mono">${esc((a.ts||'').replace('T',' ').slice(0,16))}</td><td>${esc(a.userName)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join('') || emptyRow(4,'No activity yet.')}</tbody></table></div></div>`;
};
CHG.userRole = async el => {
  if(!isAdmin()) return; const u = USERS.find(x => x.id === el.dataset.id); if(!u) return;
  if(u.role === 'Admin' && el.value !== 'Admin' && USERS.filter(x => x.role === 'Admin').length < 2){ toast('There must be at least one Admin', 'bad'); renderMain(); return; }
  logActivity('Changed role', `${u.name}: ${u.role} → ${el.value}`); u.role = el.value; await saveState(); refreshIdentity(); renderMain(); toast('Role updated');
};
ACT.userAdd = async () => { const n = $('#nu_name').value.trim(); if(!n) throw new Error('Enter a name.'); addUser(n, $('#nu_role').value); await commitNow('Added user', n, 'User added'); };
ACT.userDel = async b => { const u = USERS.find(x => x.id === b.dataset.id); if(!u) return; USERS = USERS.filter(x => x.id !== u.id); await commitNow('Removed user', u.name, 'User removed'); };

/* ============================================================
   FILE SAVING, STARTUP
   ============================================================ */
async function saveFile(filename, data, mime){
  const blob = data instanceof Blob ? data : new Blob([data], {type: mime || 'application/octet-stream'});
  try{
    if(window.claude && window.claude.use){
      const dl = await window.claude.use('downloads');
      if(dl){ await dl.save({filename, data: blob}); return; }
    }
  }catch(e){ if(e && /declin|cancel|denied/i.test(String(e.message||e.code))) return; }
  const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function saveWorkbook(wb, filename){
  const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  await saveFile(filename, new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
if(typeof Chart !== 'undefined'){ Chart.defaults.font.family = "'Inter',sans-serif"; Chart.defaults.color = '#5E6A80'; }

async function init(){
  await storeInit();
  await identityInit();
  const found = await storeLoad();
  STATE = defaultState();
  const hadData = Object.keys(found).length > 0;
  if(hadData){
    for(const k in found){ try{ setShard(k, JSON.parse(found[k])); Store.last[k] = found[k]; }catch(e){ console.error('bad shard', k, e); } }
    // fill anything an older save lacks
    const d = defaultState();
    ['rules','auditLog','valuations','structured','trades','debts','deposits','investments','transactions','journal'].forEach(k => { if(STATE[k] == null) STATE[k] = d[k]; });
    STATE.rules = Object.assign({learned:{}, contra:{}, posting:d.rules.posting}, STATE.rules); STATE.rules.posting = Object.assign({}, d.rules.posting, STATE.rules.posting);
    if(!STATE.fx) STATE.fx = d.fx;
  } else if(Store.mode !== 'db' || Store.canWrite){
    await saveState();      // first ever open: store the JFI template
  }
  const ok = await resolveUser();
  storeSubscribe();
  if(ok) await enterApp(); else renderAuthOverlay();
}
init().catch(e => { console.error(e); const m = document.getElementById('main'); if(m) m.innerHTML = '<div class="card"><h3>The app could not start</h3><p class="helptext bad">' + esc(e.message || e) + '</p></div>'; });
</script>
